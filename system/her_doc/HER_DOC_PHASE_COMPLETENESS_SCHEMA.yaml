schema_id: HER_DOC_PHASE_COMPLETENESS_SCHEMA
version: 1
phase_ids: [P01, P02, P03, P04, P05, P06, P07, P08, P09, P10]
required_check_items:
  - phase_goal
  - controller
  - input_contract
  - output_contract
  - schema
  - runtime_output_model
  - runner_binding
  - trace_requirements
  - acceptance_criteria
  - handoff_contract
  - r00_schedulability
  - downstream_consumability
  - p09_replay_readiness
  - p10_upgrade_readiness
per_item_required_fields:
  - status
  - evidence_path
  - proof_method
  - confidence
  - missing_reason
  - next_action
status_enum: [PRESENT, PARTIAL, DOCUMENT_ONLY, MISSING, NOT_PROVEN, BROKEN]
final_phase_status_enum: [STAGE_READY, STAGE_READY_WITH_GAPS, STAGE_BLOCKED, DOCUMENT_ONLY, NOT_PROVEN]

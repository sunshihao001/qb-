  - {test_id: CPO_TEST_005, name: P07 直接进入 paper runtime, expected_status: CPO_BLOCKED}
  - {test_id: CPO_TEST_006, name: live execution path detected, expected_status: CPO_BLOCKED}
  - {test_id: CPO_TEST_007, name: wallet signing path detected, expected_status: CPO_BLOCKED}
  - {test_id: CPO_TEST_008, name: trace chain degraded but usable, expected_status: CPO_READY_WITH_GAPS_OR_PAUSED}
  - {test_id: CPO_TEST_009, name: trace chain unusable, expected_status: CPO_BLOCKED}
  - {test_id: CPO_TEST_010, name: P09 连续三次复盘失败, expected_status: CPO_PAUSED}

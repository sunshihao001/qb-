  - {test_id: CPO_TEST_013, name: paper model drift high, expected_status: CPO_PAUSED}
  - {test_id: CPO_TEST_014, name: 数据源部分缺失但被 gap 传递, expected_status: CPO_READY_WITH_GAPS}
  - {test_id: CPO_TEST_015, name: 每日复盘生成 next_day_mode, expected_status: CPO_READY}
  - {test_id: CPO_TEST_016, name: 风险事件高于阈值, expected_status: CPO_PAUSED_OR_TRIGGER_FIX_SPRINT}
  - {test_id: CPO_TEST_017, name: sample library 正常累计, expected_status: CPO_READY}
  - {test_id: CPO_TEST_018, name: 未登记路径写入, expected_status: CPO_BLOCKED}

trace_events:
  - o00_started
  - governance_policy_loaded
  - pipeline_run_created
  - controller_registry_loaded
  - source_routed
  - execution_plan_created
  - stage_queue_created
  - transition_checked
  - stage_dispatched
  - stage_completed
  - stage_failed
  - gap_propagated
  - recovery_decided
  - pipeline_acceptance_built
  - final_handoff_written

state_machine:
  initial: RAW_RECEIVED
  transitions:
    RAW_RECEIVED: K00_INTAKE_READY
    K00_INTAKE_READY: K01_PASSPORT_READY
    K01_PASSPORT_READY: K02_SEMANTIC_INDEX_READY
    K02_SEMANTIC_INDEX_READY: K03_FUNCTIONAL_OBJECTS_READY
    K03_FUNCTIONAL_OBJECTS_READY: K04_SYSTEM_MAPPING_READY
    K04_SYSTEM_MAPPING_READY: K05_CANDIDATES_READY
    K05_CANDIDATES_READY: K06_TASK_PACKAGE_READY
    K06_TASK_PACKAGE_READY: K07_ACCEPTANCE_READY
    K07_ACCEPTANCE_READY: K08_INDEX_READY
  terminal_states:
    - KNOWLEDGE_PROCESSING_READY
    - KNOWLEDGE_PROCESSING_READY_WITH_GAPS
    - KNOWLEDGE_PROCESSING_BLOCKED

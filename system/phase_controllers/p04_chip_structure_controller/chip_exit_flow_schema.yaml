schema_id: "chip_exit_flow_schema"
json_schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  title: "Chip Exit Flow Record"
  description: "P04 structure-state record. Candidate-only and trace-required."
  type: "object"
  required:
    - "record_id"
    - "wallet_entity_id"
    - "exit_flow_type_candidate"
    - "amount"
    - "trace_ids"
  properties:
    record_id:
      type: "string"
    token_address:
      type:
        - "string"
        - "null"
    snapshot_time:
      type:
        - "string"
        - "null"
    cohort_id:
      type:
        - "string"
        - "null"
    wallet_entity_id:
      type:
        - "string"
        - "null"
    candidate_only:
      const: true
    source_record_ids:
      type: "array"
      items:
        type: "string"
    trace_ids:
      type: "array"
      items:
        type: "string"
    limitations:
      type: "array"
      items:
        type: "string"
    quality_level:
      type: "string"
      enum:
        - "BLOCKED"
        - "LOW"
        - "MEDIUM"
        - "HIGH"
        - "UNKNOWN"
        - "NOT_APPLICABLE"
    created_at:
      type: "string"
    exit_flow_type_candidate:
      type: "string"
      enum:
        - "SELL"
        - "CLEAR_OUT"
        - "TRANSFER_OUT"
        - "UNKNOWN_EXIT"
        - "NOT_EXIT"
    amount:
      type:
        - "number"
        - "null"
  additionalProperties: true

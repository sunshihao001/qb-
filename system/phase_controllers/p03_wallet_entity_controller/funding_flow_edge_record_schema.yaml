schema_id: "funding_flow_edge_record_schema"
json_schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  title: "Funding Flow Edge Record"
  description: "P03 candidate-only record. Must include trace and limitations."
  type: "object"
  required:
    - "record_id"
    - "from_address"
    - "to_address"
    - "trace_ids"
  properties:
    record_id:
      type: "string"
    candidate_id:
      type:
        - "string"
        - "null"
    token_address:
      type:
        - "string"
        - "null"
    wallet_address:
      type:
        - "string"
        - "null"
    wallet_entity_id:
      type:
        - "string"
        - "null"
    confidence_level:
      type: "string"
      enum:
        - "UNKNOWN"
        - "LOW"
        - "MEDIUM"
        - "HIGH"
        - "NOT_APPLICABLE"
    confidence_score:
      type:
        - "number"
        - "null"
      minimum: 0
      maximum: 1
    source_record_ids:
      type: "array"
      items:
        type: "string"
    counter_evidence:
      type: "array"
      items:
        type: "string"
    limitations:
      type: "array"
      items:
        type: "string"
    trace_ids:
      type: "array"
      items:
        type: "string"
    created_at:
      type: "string"
    from_address:
      type: "string"
    to_address:
      type: "string"
    flow_type_candidate:
      type: "string"
    amount_usd:
      type:
        - "number"
        - "null"
  additionalProperties: true

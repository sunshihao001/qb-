registry_id: phase_registry
system: SIKK_STABLE_TRADER_OS
version: 2.1-k00
updated_at: '2026-05-11T10:10:00Z'
phase_controller_rule: Phase Controller 不是阶段说明文档。Phase Controller 是一个可调度的阶段运行单元，负责把系统目标拆成阶段目标，把阶段目标拆成任务树，把任务树绑定到输入合约、输出合约、Atomic
  Skill、代码工具、验收门、状态回写和下游交接包。它不追求一次性给出智能判断，而是保证每一个判断都有字段来源、证据等级、反证记录、失败处理和可复盘路径。
global_phase_rules:
  all_phases_are_schedulable_units: true
  markdown_is_not_runtime_completion_source: true
  acceptance_gate_decides_completion: true
  handoff_packet_required_for_downstream: true
  k00_route_status_required_for_phase_ready: true
  valid_k00_route_status_for_ready:
  - K00_INTAKE_ACCEPTED
  - K00_ROUTE_RECOVERY_DOCUMENTED
  missing_or_failed_k00_route_blocks_ready: true
  missing_required_fact_policy: do_not_infer; mark_gap_or_block_by_contract
  report_policy: human_readable_only; never_machine_judgement_source
phase_order:
- K00
- P00
- P01
- P02
- P03
- P04
- P05
- P06
- P07
- P08
- P09

registry_id: hard_negative_registry
version: '2.0'
updated_at: '2026-05-11T02:27:03Z'
inheritance_rule: hard negatives are inherited downstream and cannot be erased by
  narrative scores
hard_negatives:
- code: DATA_INVALID
  phase_scope: P01+
  trigger_definition: 关键事实无效、冲突或无法解析
  severity: BLOCK
  action: write_gap_and_stop_downstream
  requires_evidence:
  - field_source
  - evidence_level
  - counter_evidence
  - audit_ref
  clearance_policy: may only be cleared by explicit downstream recheck with stronger
    evidence and audit record
- code: WALLET_BLOCK
  phase_scope: P02+
  trigger_definition: 钱包结构出现不可接受风险实体/黑名单/伪造结构
  severity: BLOCK
  action: inherit_and_recheck_downstream
  requires_evidence:
  - field_source
  - evidence_level
  - counter_evidence
  - audit_ref
  clearance_policy: may only be cleared by explicit downstream recheck with stronger
    evidence and audit record
- code: ACTIVE_DISTRIBUTION
  phase_scope: P03+
  trigger_definition: 活跃派发/出货结构成立
  severity: BLOCK_OR_RISK
  action: inherit_as_negative
  requires_evidence:
  - field_source
  - evidence_level
  - counter_evidence
  - audit_ref
  clearance_policy: may only be cleared by explicit downstream recheck with stronger
    evidence and audit record
- code: TRANSFER_TO_COUNTERPARTY
  phase_scope: P02+
  trigger_definition: 关键地址向对手盘/可疑归集转移

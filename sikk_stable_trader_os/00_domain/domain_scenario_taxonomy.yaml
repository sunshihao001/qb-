scenario_taxonomy:
  - scenario_id: S01
    scenario_name: 开盘吸筹
    definition: "开盘吸筹 的领域场景定义；仅描述结构语义，不代表交易许可。"
    data_requirements: [wallet_role_evidence, chip_control_evidence, market_structure_fields, volume_fields, market_cap_context]
    supporting_evidence: [multi_source_alignment, time_aligned_wallet_and_market_behavior]
    counter_evidence: [hard_negative_rules, evidence_conflict, stale_or_missing_critical_fields]
    forbidden_misread: "不得把场景候选直接解释为可以买或一定上涨。"
    downstream_status_suggestion: DOMAIN_SCENARIO_CANDIDATE

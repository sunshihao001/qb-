  file: 06_phase_execution_protocol.md
  template: 00_knowledge_intake/task_packages/phase_task_execution_package_standard/06_phase_execution_protocol_TEMPLATE.md
  role: 告诉 HER 怎么运行，不是描述阶段；这是 HER 长任务运行的核心。
  runtime_principle: HER 不得把用户输入资料当作普通文档阅读，必须转化为系统可执行任务包。

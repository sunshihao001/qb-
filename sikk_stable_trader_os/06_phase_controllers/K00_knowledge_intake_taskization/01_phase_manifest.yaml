phase_manifest:
  phase_id: K00
  phase_key: K00_knowledge_intake_taskization
  phase_name: 知识资料摄取与任务化控制器
  phase_type: pre_phase_controller
  mission:
    primary: 将用户输入的文档、知识资料、方法论文本转化为 HER 可执行的阶段任务执行包
    secondary:
    - 保存原始资料
    - 生成文档护照
    - 建立语料索引
    - 映射系统平面
    - 识别系统缺口
    - 生成任务执行包
    - 输出 handoff_packet
  authority:
    can_do:
    - 读取用户输入资料
    - 保存资料
    - 生成资料登记
    - 建立任务包
    - 识别系统影响
    - 生成下一阶段建议
    cannot_do:
    - 不能直接输出交易判断
    - 不能直接改写实时规则
    - 不能跳过 P00
    - 不能把资料当普通文档总结后结束
    - 不能依赖聊天上下文作为唯一依据
    - 不能把文档知识输入自动化等同于直接交易自动化
    - 不能生成真实买卖指令
    - 不能跳过 P00/P05/P06/P07 交易边界与门禁
  upstream:
    required:
    - user_input
    optional:
    - uploaded_files
    - previous_system_docs
    - legacy_runtime_outputs
  downstream:
    next_phase_candidates:
    - P00_system_boundary
    - P01_data_fact
    - P09_self_upgrade
    handoff_required: true
compatibility_runtime_metadata:
  phase_id: K00
  phase_name: K00_knowledge_intake_taskization_controller
  phase_display_name: 知识资料摄取与任务化控制器
  phase_domain: knowledge_intake_taskization
  phase_type: schedulable_phase_runtime_unit
  placement: before_P00
  is_trading_phase: false
  controller_definition: Phase Controller 不是阶段说明文档。K00 不是交易阶段，也不是普通文档总结阶段。K00 是所有上传文档、方法轮、知识资料、截图说明、旧系统文档、GPT
    链接内容、方法论文本进入 SIKK Stable Trader OS 前的知识资料摄取、保存、建模、任务化、阶段映射、执行包生成与下游交接运行单元；它负责把用户输入资料转化为
    HER 可执行的阶段任务包。
  system: SIKK Stable Trader OS
  version: 0.2.0
  created_at: '2026-05-11T09:45:00Z'
  updated_at: '2026-05-11T10:05:00Z'
  runtime_boundary: OBSERVE_PAPER_ONLY
  mission:
    primary: 将用户提供的文档、知识、截图说明、旧系统资料、GPT 链接内容、方法论文本转化为 HER 可执行阶段任务包
    controller_goal: 保存原始输入资料 -> 建立资料清单 -> 生成文档护照 -> 判断系统平面 -> 映射 P00-P09 -> 抽取可执行目标
      -> 识别系统缺口 -> 生成阶段任务执行包 -> 建立 phase_state -> 建立 handoff_packet -> 自动进入下一阶段
  k00_objectives:
  - 保存原始输入资料
  - 建立资料清单
  - 生成每份资料的文档护照
  - 判断资料属于系统哪个平面
  - 判断资料影响 P00-P09 哪些阶段
  - 抽取可执行目标
  - 识别系统缺口
  - 生成阶段任务执行包
  - 建立 phase_state
  - 建立 handoff_packet
  - 自动进入下一阶段
  authority:
    can_do:
    - receive_uploaded_documents
    - receive_method_wheel_materials
    - receive_knowledge_notes
    - receive_screenshot_explanations
    - receive_legacy_system_documents
    - receive_gpt_link_content
    - receive_methodology_text
    - preserve_raw_material_snapshot
    - build_material_inventory
    - generate_document_passport
    - classify_system_plane
    - map_material_to_P00_P09
    - extract_executable_objectives
    - identify_system_gaps
    - generate_phase_task_execution_package
    - write_phase_state
    - write_handoff_packet
    - auto_route_to_next_phase_when_gate_passes
    - write_audit_ref
    cannot_do:
    - 禁止 treat_summary_as_raw_fact
    - 禁止 overwrite_raw_material_without_snapshot
    - 禁止 infer_missing_required_fact
    - 禁止 skip_source_attribution
    - 禁止 skip_acceptance_gate
    - 禁止 bypass_handoff_packet
    - 禁止 authorize_real_trade
    - 禁止 read_or_write_private_key
    - 禁止 sign_transaction
    - 禁止 broadcast_transaction
    - 禁止 execute_swap
  upstream:
    required:
    - user_supplied_material_or_import_pointer
    optional:
    - uploaded_document
    - method_wheel_material
    - knowledge_note
    - screenshot_explanation
    - legacy_system_document
    - gpt_link_content
    - methodology_text
    - existing_system_registry
    - existing_phase_index
    - existing_skill_index
    - existing_contract_index
    - prior_gap_register
  downstream:
    next_phase: P00_system_boundary
    handoff_required: true
    auto_advance_policy: advance_to_P00_when_acceptance_gate_passes_and_handoff_schema_validates
    consumers:
    - P00_system_boundary
    - HER_task_router
    - phase_controller_registry
    - total_control_plane
    - task_runtime_executor
    - gap_closure_planner
  atomic_skills_bound:
  - her_document_intake_task_pack_v1
  - document_passport_generation_skill
  - material_inventory_skill
  - semantic_modeling_skill
  - system_plane_mapping_skill
  - phase_mapping_skill
  - gap_identification_skill
  - task_package_generation_skill
  - acceptance_gate_skill
  required_package_files:
  - 01_phase_manifest.yaml
  - 02_phase_context_pack.md
  - 03_phase_objective_tree.yaml
  - 04_phase_input_contract.json
  - 05_phase_output_contract.json
  - 06_phase_execution_protocol.md
  - 07_phase_acceptance_gate.yaml
  - 08_phase_state.json
  - 09_phase_handoff_packet.schema.json
  evidence_requirements:
  - 字段来源 field_source_map
  - raw_material_snapshot_ref
  - material_inventory_ref
  - document_passport_ref
  - system_plane_mapping
  - P00_P09_phase_mapping
  - executable_objectives
  - gap_register
  - evidence_level
  - 反证 counter_evidence
  - decision_trace
  - audit_ref
  - 验收 acceptance_gate
  - handoff_packet

automated_long_task_execution_logic_ref:
  anchor: 9. 自动化长任务执行逻辑
  standard_loop:
  - 读取 phase_state
  - 找到 current_task_id
  - 执行当前 task
  - 生成对应输出
  - 更新 phase_state
  - 检查 acceptance_gate
  - 如果未完成，继续下一个 task
  - 如果完成，生成 handoff_packet
  - 根据 next_phase_rules 进入下一阶段
  - 重复执行
  auto_continue_decision_checks:
  - 当前阶段是否 PHASE_READY
  - 是否存在 BLOCKER gap
  - 是否存在 next_phase_recommendation
  - 下一个阶段是否有输入
  - 是否允许继续
  stop_conditions:
  - PHASE_REJECTED
  - PHASE_ERROR
  - 缺少关键输入
  - 命中 BLOCKER gap
  - 用户明确要求停止
  - 下一阶段不存在
  - 下一阶段需要人工补充资料
  runtime_rule: HER 是多步骤长任务执行器，不是单次回答器；每一轮必须读取 phase_state、执行 current_task_id、更新 phase_state、检查
    acceptance_gate、按 next_phase_rules 自动继续或按停止条件停止。
automated_trading_workflow_integration_ref:
  anchor: 10. 如何落实到自动化交易流程工作流
  boundary_principle: 文档知识输入自动化不是直接交易自动化；K00 只将交易系统建设资料资产化并交接给下游阶段。
  final_trading_workflow:
  - K00_knowledge_intake
  - P00_system_boundary
  - P01_data_fact
  - P02_market_scenario
  - P03_wallet_structure
  - P04_chip_control
  - P05_strategy_gate
  - P06_risk_control
  - P07_paper_execution_human_confirmation
  - P08_review_attribution
  - P09_self_upgrade_proposal
  assetization_rule: 所有新资料必须离开聊天上下文，进入 raw_inputs/source_registry/document_passports/system_mapping/gap_detection/task_packages/handoff_packets
    等系统资产。
  must_not_do:
  - direct_trade_automation
  - generate_real_buy_sell_order
  - skip_P00_boundary
  - skip_P05_P06_P07_gates
  - store_only_in_chat_context
  - rewrite_trading_workflow_without_acceptance
total_control_skill_k00_input_routing_rules:
  anchor: 11. 总控 Skill：K00 文档知识输入强制路由核心规则
  trigger_input_types:
  - 文档
  - 知识资料
  - 方法论
  - 系统设计
  - 旧系统说明
  - GPT 链接内容
  - 截图转述内容
  controller: K00_knowledge_intake_taskization_controller
  rules:
  - 不允许当作普通文档阅读后结束。
  - 必须进入 K00_knowledge_intake_taskization_controller。
  - 必须保存原始资料。
  - 必须生成 doc_id。
  - 必须生成 document_passport。
  - 必须映射到九大系统平面。
  - 必须映射到 P00-P09 阶段。
  - 必须识别系统缺口。
  - 必须生成 task_execution_package。
  - 必须生成 handoff_packet。
  - 必须更新 phase_state。
  - 如果 acceptance_gate 通过，必须自动进入下一阶段。
  - 不能依赖聊天上下文作为系统记忆。
  - 不能只输出总结或建议。
  required_artifacts:
  - raw_input
  - doc_id
  - document_passport
  - plane_mapping
  - phase_mapping
  - gap_detection
  - task_execution_package
  - handoff_packet
  - phase_state
  forbidden:
  - plain_document_reading_then_stop
  - summary_only
  - advice_only
  - chat_context_as_system_memory
  auto_advance_when_gate_passes: true

phase_id: K00_knowledge_intake_taskization
phase_name_cn: 知识摄取与任务化
phase_type: knowledge_assetization
phase_status: READY_TO_EXECUTE
authority_scope: 只负责知识资产化，不负责系统运行裁决
primary_goal: 将用户输入、研究资料、旧系统文件、链接内容、方法轮文本转化为可登记、可索引、可交接的知识资产。
non_goal:
- 不直接生成交易判断
- 不直接启动 P01-P10
- 不直接裁决策略是否可运行
- 不直接修改真实交易系统
upstream_dependencies:
- user_input
- uploaded_documents
- existing_project_files
required_inputs:
- raw_text_or_file
- source_metadata
optional_inputs:
- user_goal
- related_stage_hint
- old_system_reference
forbidden_inputs:
- real_trade_instruction
core_objects:
- knowledge_asset
- document_passport
- task_package
- intake_mapping
- gap_report
core_questions:
- 资料是否已经保存？
- 资料属于哪个系统主题？
- 资料中包含哪些方法、规则、阶段、字段、缺口？
- 资料应该交给哪个下游阶段？
required_outputs:
- raw_input_copy
- document_passport
- knowledge_index
- task_execution_package
- gap_report
- handoff_packet
handoff_outputs:
- task_package_to_P00
acceptance_gate:
- 输入资料已保存
- passport 已生成
- task package 已生成
- handoff packet 已生成
blocking_conditions:
- 输入为空
- 无法确定资料来源
- 输出文件不可解析
downstream_consumers:
- P00_system_bootstrap_controller
runner_binding_status: optional
state_writeback_required: true
paper_only_required: true
real_trade_allowed: false
status_normalization_note: User-proposed phase_status ASSETIZATION_LAYER is not in
  legal enum; normalized to READY_TO_EXECUTE for machine validation while preserving
  raw proposal.

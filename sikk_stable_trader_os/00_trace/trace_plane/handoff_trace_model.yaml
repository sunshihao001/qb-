handoff_trace_record:
  trace_id: string
  handoff_packet_id: required
  from_phase: required
  to_phase: required
  created_at: required
  packet: required
  transmitted_content: required
  downstream_rules: required
  consumption: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

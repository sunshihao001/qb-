contract_trace_record:
  trace_id: string
  contract_id: required
  contract_type: required
  produced_by_phase: required
  consumed_by_phase: required
  contract_file_path: required
  produced_at: required
  consumed_at: required
  validation: required
  trace_links: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

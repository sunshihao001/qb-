task_tree_trace_record:
  trace_id: string
  task_tree_id: required
  root_goal: required
  target_phase: required
  created_by: required
  created_at: required
  tasks: required
  completion: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

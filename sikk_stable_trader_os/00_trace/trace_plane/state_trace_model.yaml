state_trace_record:
  trace_id: string
  state_machine_name: required
  object_id: required
  object_type: required
  transition: required
  reason: required
  validation: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

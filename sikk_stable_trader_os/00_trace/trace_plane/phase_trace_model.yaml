phase_trace_record:
  trace_id: string
  phase_id: required
  phase_name: required
  phase_type: required
  started_at: required
  finished_at: required
  upstream: required
  execution: required
  output: required
  acceptance: required
  downstream: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

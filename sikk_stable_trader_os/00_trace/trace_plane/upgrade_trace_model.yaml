upgrade_trace_record:
  trace_id: string
  upgrade_id: required
  proposed_at: required
  proposed_by: required
  upgrade_type: required
  source: required
  governance: required
  implementation: required
  required_trace_links:
    - parent_trace_ids
    - child_trace_ids
    - related_artifact_trace_ids
  validation_rules:
    - trace_id_present
    - source_present
    - downstream_usage_declared
    - forbidden_actions_respected

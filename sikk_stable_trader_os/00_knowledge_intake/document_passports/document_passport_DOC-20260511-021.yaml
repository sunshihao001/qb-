summary:
  core_intent: 将 Governance Plane 从规则说明升级为系统权限与风险裁决平面，先于 Domain/Data 建立并阻断 P01 越权。
  key_points:
  - 治理平面不分析 token、不判断钱包、不产生交易信号、不运行 paper trade
  - 覆盖 K00-P10 阶段 authority boundary 与 can/cannot 权限矩阵
  - P0 硬否定包括真实交易、P01 绕过 Data Plane、paper runner 绕过 P06/P07、复盘直接改规则
  - 限制确定性语言，禁止缺失字段靠推断补齐
  - 输出 Governance→Domain/Data/Control 正式约束和 readiness gate
  - 完成后仍不能进入 P01，下一步是 Domain/Data 等系统平面继续生成验收

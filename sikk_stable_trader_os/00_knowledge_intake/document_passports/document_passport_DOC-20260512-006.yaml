summary:
  core_intent: 将 P06 定义为由 P05 证据束驱动的场景识别控制器，输出场景候选、冲突、否定、未知、置信度、观察/失效条件与 P07 策略门控数据请求，但不做策略准入或
    runtime。
  key_points:
  - P06 只识别场景候选，不输出买卖、paper_ready、执行许可或实盘确认
  - P06 必须读取 P05 handoff、evidence bundle、反证、未知、冲突、替代解释与 usage permission
  - 每个场景必须包含成立条件、否定条件、冲突条件、失效条件、观察条件、替代场景
  - UNKNOWN / CONFLICTED / OBSERVE_ONLY 是合法输出
  - P06 只能 handoff 给 P07 Strategy Gate Controller

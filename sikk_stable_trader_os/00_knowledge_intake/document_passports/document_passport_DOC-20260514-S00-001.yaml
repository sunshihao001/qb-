  core_intent: 建立 HER/SIKK 全体系统一标准控制层，服务真实 token 阶段化判断闭环，而非增加文档数量。
  key_points:
  - 任意判断可追溯目标/方法/输入/字段血缘/runner/trace/acceptance/handoff
  - runner 必须绑定 Phase Controller
  - paper-only 决策经过 P08 permission gate
  - 复盘升级进入 P09/P10 shadow/regression/rollback，不直接改实时规则
  - legacy runtime 通过 absorption map 收编
  - schema/contract 必须有版本/消费者/验证/失败策略
  - 默认禁止真实交易，paper-only 边界

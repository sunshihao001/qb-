summary:
  core_intent: >-
    Define a mandatory K00 intake flow that preserves raw source material and converts uploaded HER system construction prompts into file-backed, auditable, handoff-ready assets.
  key_points:
    - K00 is the mandatory entry for uploaded system materials.
    - Raw input, registry, passport, index, mapping, gaps, task package, state, acceptance, and handoff are all required.
    - Direct entry to PXX/IXX/Runner/Paper/Live is forbidden without K00 acceptance and handoff.
    - File-backed state and trace/audit are mandatory.
    - Unresolved gaps must be preserved and cannot be rewritten away.
  non_goals:
    - No trading logic.
    - No runner start.
    - No paper runtime start.
    - No live runtime start.
    - No production rule modification.
